.tag { fill: var(--tag); stroke: var(--tag-line); stroke-width: 1; }

text.gone { fill: var(--gone); }

nder one word. The triangle holds door; the board's</text><text class="row more" x="1665" y="1064">door is under Ask.</text><text class="row conflict" x="1665" y="1086">two stores of thought: daq.store (git, on the stick) and D1</text><text class="row more" x="1665" y="1108">(door's records) both keep thought.</text><text class="row conflict" x="1665" y="1130">places: A sheet may not name a place, and the card is places.</text><text class="row more" x="1665" y="1152">So map.card is a skin, outside the sheet grammar: the</text><text class="row more" x="1665" y="1174">browser's answer only.</text><text class="row conflict" x="1665" y="1196">portrait on landscape: The card is portrait and the surface</text><text class="row more" x="1665" y="1218">landscape. The card stands in the middle; the diagram uses the</text><text class="row more" x="1665" y="1240">margins.</text><text class="row conflict" x="1665" y="1262">live is a snapshot: The site fetches nothing, so the diagram</text><text class="row more" x="1665" y="1284">is what map.live saw on its day, until it is written again.</text></g><a href="explore" aria-label="The entry: explore"><polygon points="938,287 1238,287 1088,457" fill="transparent"/></a></svg>
