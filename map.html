8" y="222">Ask: input: what is asked</text><text class="row repo" x="28" y="246">this site: the board: Shape, the email sheets, floppies; one</text><text class="row more" x="28" y="268">grammar for any device</text><text class="head" x="28" y="302">Thoughts: input: what is kept as thought</text><text class="row connector" x="28" y="326">D1: six databases; door writes one and reads all</text><text class="row connector" x="28" y="348">reader: a Worker: a keyed, read-only page over the documentation</text><text class="row repo" x="28" y="370">daq.store: thought: what devices write, sessions and now</text><text class="head" x="28" y="404">C, the pair: the pair: seats joined</text><text class="row repo" x="28" y="428">tailnet: joins the seats and the devices</text><text class="row repo" x="28" y="450">mac: an owner seat; burns the stick</text><text class="row repo" x="28" y="472">iphone: an owner seat</text><text class="row repo" x="28" y="494">Muse: a second seat; runs on the mac; not on the tailnet yet</text><text class="head" x="28" y="528">Achievements: what is done and kept</text><text class="row connector" x="28" y="552">GitHub: the repositories and their history; a merge publishes</text><text class="row more" x="28" y="574">the site</text><text class="head" x="28" y="608">Workflows: the verbs that cross</text><text class="row repo" x="28" y="632">oasis wire: the MCP grip and the wire: plant, the first verb</text><text class="head" x="28" y="666">Compatibility: the same thing on every device</text><text class="row repo" x="28" y="690">DAQ stick: carries daq.code and daq.store between devices</text><text class="head" x="28" y="724">Heartbeat: says it is alive</text><text class="row repo" x="28" y="748">pi0: the cockpit; writes itself down every minute</text><text class="head" x="28" y="782">Health: says how it is</text><text class="row gone" x="28" y="806">missing</text><text class="head" x="28" y="840">Alerts: says when it is not well</text><text class="row gone" x="28" y="864">missing</text><text class="head" x="28" y="898">R, on the mountain: run</text><text class="row repo" x="28" y="922">pi5: the kernel: runs apps from the stick</text><text class="head" x="28" y="956">Random Forest: the base: many below</text><text class="row repo" x="28" y="980">oasis (Linux): rim, spine, vault: judges every crossing</text><text class="row repo" x="28" y="1002">every reader: each browser that opens the site is one live</text><text class="row more" x="28" y="1024">state; none is kept</text><text class="row repo" x="28" y="1046">ekalavya: a sibling site</text><text class="head" x="28" y="1080">L1 Control: a control</text><text class="row repo" x="28" y="1104">browser: generator.js: the board's knobs and Shape</text><text class="head" x="28" y="1138">R1 Control: a control</text><text class="row repo" x="28" y="1162">terminal: generator.py: the same sheets by number</text><text class="head" x="28" y="1196">L2 Control: a control</text><text class="row repo" x="28" y="1220">Pico: pins and MIDI, on the pi0</text><text class="head" x="28" y="1254">R2 Control: a control</text><text class="row repo" x="28" y="1278">KB21, 8BitDo: keys: one press, one command</text><text class="head" x="28" y="1312">seen, as of 2026-11-22</text><text class="row connector" x="28" y="1336">connector: checked live through a connector on the day</text><text class="row session" x="28" y="1358">session: the brain that wrote this snapshot</text><text class="row repo" x="28" y="1380">repo: in a repository, not checked live</text><text class="head" x="1665" y="40">Connections</text><text class="row" x="1665" y="64">Claude to door: MCP, with a seat's token</text><text class="row" x="1665" y="86">Claude to Notion: connector</text><text class="row" x="1665" y="108">Claude to GitHub: connector</text><text class="row" x="1665" y="130">Claude to oasis wire: MCP grip, stdio</text><text class="row" x="1665" y="152">Cloudflare to door: runs</text><text class="row" x="1665" y="174">Cloudflare to reader: runs</text><text class="row" x="1665" y="196">Cloudflare to this site: Pages serves</text><text class="row" x="1665" y="218">door to D1: writes one database, reads all</text><text class="row" x="1665" y="240">reader to D1: reads the documentation</text><text class="row" x="1665" y="262">GitHub to Cloudflare: a merge publishes the site</text><text class="row" x="1665" y="284">GitHub to DAQ stick: sync puts daq.code on it at a version</text><text class="row" x="1665" y="306">oasis wire to oasis (Linux): the wire: one envelope a crossing</text><text class="row" x="1665" y="328">tailnet to mac: member</text><text class="row" x="1665" y="350">tailnet to iphone: member</text><text class="row" x="1665" y="372">tailnet to pi5: member</text><text class="row" x="1665" y="394">tailnet to pi0: member</text><text class="row" x="1665" y="416">mac to DAQ stick: burns it</text><text class="row" x="1665" y="438">mac to Muse: the seat runs here</text><text class="row" x="1665" y="460">DAQ stick to pi5: mounted read-only</text><text class="row" x="1665" y="482">DAQ stick to daq.store: carries</text><text class="row" x="1665" y="504">pi0 to daq.store: its log is pulled in</text><text class="row" x="1665" y="526">pi0 to Pico: USB</text><text class="row" x="1665" y="548">pi5 to KB21, 8BitDo: keys</text><text class="row" x="1665" y="570">pi5 to pi0: the pi0 watches its screen</text><text class="row" x="1665" y="592">this site to browser: the generator in a tab</text><text class="row" x="1665" y="614">this site to terminal: the generator in a shell</text><text class="row" x="1665" y="636">this site to every reader: each opens it</text><text class="head" x="1665" y="670">Missing</text><text class="row gone" x="1665" y="694">health: Nothing gathers health. The pi0 writes itself down</text><text class="row more" x="1665" y="716">every minute and the pi5 has its shape check, but each keeps</text><text class="row more" x="1665" y="738">it to itself.</text><text class="row gone" x="1665" y="760">alerts: Nothing raises an alert. The pi0's wallpaper stops</text><text class="row more" x="1665" y="782">being green only on the pi0.</text><text class="row gone" x="1665" y="804">brain to site: A brain reaches the store through door and the</text><text class="row more" x="1665" y="826">site through a browser, never one through the other: the site</text><text class="row more" x="1665" y="848">fetches nothing.</text><text class="row gone" x="1665" y="870">Muse on the tailnet: Muse's seat runs on the mac and is not</text><text class="row more" x="1665" y="892">yet a tailnet member.</text><text class="head" x="1665" y="926">Conflicts</text><text class="row conflict" x="1665" y="950">two doors: The board's Shape door and the door Worker are both</text><text class="row more" x="1665" y="972">an entry, under one word. The triangle holds door; the board's</text><text class="row more" x="1665" y="994">door is under Ask.</text><text class="row conflict" x="1665" y="1016">two stores of thought: daq.store (git, on the stick) and D1</text><text class="row more" x="1665" y="1038">(door's records) both keep thought.</text><text class="row conflict" x="1665" y="1060">places: A sheet may not name a place, and the card is places.</text><text class="row more" x="1665" y="1082">So map.card is a skin, outside the sheet grammar: the</text><text class="row more" x="1665" y="1104">browser's answer only.</text><text class="row conflict" x="1665" y="1126">portrait on landscape: The card is portrait and the surface</text><text class="row more" x="1665" y="1148">landscape. The card stands in the middle; the diagram uses the</text><text class="row more" x="1665" y="1170">margins.</text><text class="row conflict" x="1665" y="1192">live is a snapshot: The site fetches nothing, so the diagram</text><text class="row more" x="1665" y="1214">is what map.live saw on its day, until it is written again.</text></g><a href="explore" aria-label="The entry: explore"><polygon points="93
